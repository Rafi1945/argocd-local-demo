apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  namespace: guestbook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - name: guestbook-ui
          image: rafi1945/fastapi-argocd-app:d6578c0a9b35efe96e26eccfb41a81dea465cc76
          ports:
            - containerPort: 80